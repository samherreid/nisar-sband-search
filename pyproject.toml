[project]
name = "sband-search"
version = "0.1.0"
description = "Standalone NISAR S-band (Bhoonidhi) frame search, map, and product download"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "geopandas",
    "pandas",
    "shapely",
    "pyogrio",
    "folium",
    "mapclassify",
    "matplotlib",
    "jupyter",
]

[project.scripts]
sband-search = "sband_search.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sband_search"]
